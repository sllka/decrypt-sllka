name: Analyze IPA

on:
  workflow_dispatch:
    inputs:
      ipa:
        description: "Имя IPA в корне репозитория"
        required: true
        default: "Droze.ipa"

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip file binutils llvm strings

      - name: Download Ghidra
        run: |
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0_build/ghidra_12.0_PUBLIC_20260101.zip \
            -O ghidra.zip
          unzip -q ghidra.zip
          mv ghidra_* ghidra

      - name: Extract IPA
        run: |
          mkdir -p analysis
          unzip -q "${{ github.event.inputs.ipa }}" -d analysis/ipa

      - name: Find Mach-O files
        run: |
          mkdir -p analysis/macho

          find analysis/ipa/Payload -type f -print0 |
          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "Mach-O"; then
              echo "$file" | tee -a analysis/macho/files.txt
            fi
          done

      - name: Basic Mach-O information
        run: |
          mkdir -p analysis/info

          while IFS= read -r file; do
            echo "==================================================" >> analysis/info/macho.txt
            echo "FILE: $file" >> analysis/info/macho.txt
            echo "==================================================" >> analysis/info/macho.txt

            file "$file" >> analysis/info/macho.txt 2>&1 || true

            echo >> analysis/info/macho.txt
            echo "LLVM OBJECT INFO:" >> analysis/info/macho.txt
            llvm-objdump --macho --private-headers "$file" \
              >> analysis/info/macho.txt 2>&1 || true

            echo >> analysis/info/macho.txt
            echo "DEPENDENCIES:" >> analysis/info/macho.txt
            llvm-objdump --macho --dylibs-used "$file" \
              >> analysis/info/macho.txt 2>&1 || true

            echo >> analysis/info/macho.txt
            echo "STRINGS:" >> analysis/info/macho.txt
            strings "$file" | head -n 5000 \
              >> analysis/info/macho.txt 2>&1 || true

          done < analysis/macho/files.txt

      - name: Prepare Ghidra project
        run: |
          mkdir -p analysis/ghidra_project
          mkdir -p analysis/ghidra_output

          while IFS= read -r file; do
            base="$(basename "$file")"

            "$PWD/ghidra/support/analyzeHeadless" \
              "$PWD/analysis/ghidra_project" \
              "$base" \
              -import "$PWD/$file" \
              -analysisTimeoutPerFile 300 \
              -overwrite \
              2>&1 | tee -a analysis/ghidra_output/ghidra.log || true

          done < analysis/macho/files.txt

      - name: Export useful information
        run: |
          mkdir -p analysis/report

          cp analysis/macho/files.txt analysis/report/ 2>/dev/null || true
          cp analysis/info/macho.txt analysis/report/ 2>/dev/null || true
          cp analysis/ghidra_output/ghidra.log analysis/report/ 2>/dev/null || true

          echo "Analysis completed." > analysis/report/README.txt
          echo "The Ghidra project contains the imported Mach-O binaries." >> analysis/report/README.txt
          echo "The report contains architecture, Mach-O headers, dependencies and strings." >> analysis/report/README.txt

      - name: Pack results
        run: |
          cd analysis
          zip -qr ../ipa-analysis.zip report ghidra_project

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: ipa-analysis
          path: ipa-analysis.zip
          retention-days: 7
