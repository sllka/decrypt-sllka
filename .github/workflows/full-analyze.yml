name: Droze IPA - Deep Static Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          set -e

          if [ ! -f "Droze.ipa" ]; then
            echo "::error::Droze.ipa was not found in repository root"
            exit 1
          fi

          rm -rf extracted analysis Droze-analysis.zip

          mkdir -p \
            extracted \
            analysis/app \
            analysis/macho \
            analysis/headers \
            analysis/symbols \
            analysis/objc \
            analysis/swift \
            analysis/strings \
            analysis/disasm \
            analysis/search \
            analysis/resources \
            analysis/signing \
            analysis/hashes \
            analysis/report

      - name: Extract IPA
        shell: bash
        run: |
          set -e

          unzip -q "Droze.ipa" -d extracted

          find extracted -type f -print | sort \
            > analysis/app/all_files.txt

          find extracted -type d -print | sort \
            > analysis/app/all_directories.txt

          echo "Extracted files: $(wc -l < analysis/app/all_files.txt)"

      - name: Locate application bundle
        shell: bash
        run: |
          set -e

          find extracted/Payload \
            -maxdepth 3 \
            -type d \
            -name "*.app" \
            -print \
            | sort \
            > analysis/app/app_bundles.txt

          if [ ! -s analysis/app/app_bundles.txt ]; then
            echo "::error::No .app bundle found"
            exit 1
          fi

          APP="$(head -n 1 analysis/app/app_bundles.txt)"

          echo "$APP" > analysis/app/app_path.txt

          echo "Application:"
          echo "$APP"

      - name: Application inventory
        shell: bash
        run: |
          set -e

          APP="$(cat analysis/app/app_path.txt)"

          {
            echo "===== APPLICATION ====="
            echo "$APP"
            echo

            echo "===== FILE ====="
            file "$APP"
            echo

            echo "===== FILE COUNT ====="
            find "$APP" -type f | wc -l
            echo

            echo "===== DIRECTORIES ====="
            find "$APP" -type d | sort
            echo

            echo "===== ALL FILES ====="
            find "$APP" -type f | sort

          } > analysis/app/inventory.txt

      - name: Extract Info.plist
        shell: bash
        run: |
          set +e

          APP="$(cat analysis/app/app_path.txt)"

          cp "$APP/Info.plist" \
            analysis/resources/Info.plist \
            2>/dev/null || true

          plutil -p "$APP/Info.plist" \
            > analysis/resources/Info_readable.txt \
            2>&1 || true

          plutil -convert xml1 \
            -o analysis/resources/Info.xml \
            "$APP/Info.plist" \
            2>/dev/null || true

      - name: Find all Mach-O files
        shell: bash
        run: |
          set +e

          : > analysis/macho/macho_files.txt

          while IFS= read -r -d '' FILE; do
            TYPE="$(file -b "$FILE" 2>/dev/null || true)"

            if echo "$TYPE" | grep -q "Mach-O"; then
              echo "$FILE" >> analysis/macho/macho_files.txt
            fi
          done < <(find extracted -type f -print0)

          sort -u \
            analysis/macho/macho_files.txt \
            -o analysis/macho/macho_files.txt

          echo "Mach-O files:"
          cat analysis/macho/macho_files.txt

      - name: Find dylibs frameworks bundles
        shell: bash
        run: |
          set -e

          find extracted \
            -type f \
            -name "*.dylib" \
            -print \
            | sort \
            > analysis/macho/dylibs.txt

          find extracted \
            -type d \
            -name "*.framework" \
            -print \
            | sort \
            > analysis/macho/frameworks.txt

          find extracted \
            -type d \
            -name "*.bundle" \
            -print \
            | sort \
            > analysis/macho/bundles.txt

      - name: Mach-O complete analysis
        shell: bash
        run: |
          set +e

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            BASE="$(basename "$FILE")"
            SAFE="$(echo "$BASE" | tr ' /:' '___' | tr -cd '[:alnum:]_.-')"

            OUT="analysis/headers/${SAFE}_headers.txt"

            {
              echo "============================================================"
              echo "FILE"
              echo "============================================================"
              echo "$FILE"

              echo
              echo "===== FILE TYPE ====="
              file "$FILE"

              echo
              echo "===== ARCHITECTURE ====="
              lipo -info "$FILE"

              echo
              echo "===== UUID ====="
              dwarfdump --uuid "$FILE"

              echo
              echo "===== MACH HEADER ====="
              otool -hv "$FILE"

              echo
              echo "===== LOAD COMMANDS ====="
              otool -l "$FILE"

              echo
              echo "===== LINKED LIBRARIES ====="
              otool -L "$FILE"

              echo
              echo "===== DYLD INFO ====="
              dyld_info "$FILE" 2>/dev/null || true

            } > "$OUT" 2>&1

          done < analysis/macho/macho_files.txt

      - name: Extract sections
        shell: bash
        run: |
          set +e

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            BASE="$(basename "$FILE")"
            SAFE="$(echo "$BASE" | tr ' /:' '___' | tr -cd '[:alnum:]_.-')"

            otool -l "$FILE" 2>/dev/null \
              | grep -A20 -E \
              "sectname|segname|vmaddr|vmsize|fileoff|filesize|prot" \
              > "analysis/macho/${SAFE}_sections.txt" \
              || true

          done < analysis/macho/macho_files.txt

      - name: Extract dependencies
        shell: bash
        run: |
          set +e

          : > analysis/search/dependencies.txt

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            {
              echo "============================================================"
              echo "$FILE"
              echo "============================================================"
              otool -L "$FILE" 2>&1 || true
              echo
            } >> analysis/search/dependencies.txt

          done < analysis/macho/macho_files.txt

      - name: Extract all symbols
        shell: bash
        run: |
          set +e

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            BASE="$(basename "$FILE")"
            SAFE="$(echo "$BASE" | tr ' /:' '___' | tr -cd '[:alnum:]_.-')"

            nm -arch arm64 -m "$FILE" \
              > "analysis/symbols/${SAFE}_all.txt" \
              2>&1 || true

            nm -arch arm64 -g "$FILE" \
              > "analysis/symbols/${SAFE}_global.txt" \
              2>&1 || true

            nm -arch arm64 -gU "$FILE" \
              > "analysis/symbols/${SAFE}_exports.txt" \
              2>&1 || true

            nm -arch arm64 -u "$FILE" \
              > "analysis/symbols/${SAFE}_imports.txt" \
              2>&1 || true

          done < analysis/macho/macho_files.txt

      - name: Objective-C analysis
        shell: bash
        run: |
          set +e

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            BASE="$(basename "$FILE")"
            SAFE="$(echo "$BASE" | tr ' /:' '___' | tr -cd '[:alnum:]_.-')"

            {
              echo "===== OBJECTIVE-C SYMBOLS ====="

              nm -arch arm64 "$FILE" 2>/dev/null \
                | grep -Ei \
                "OBJC|_objc_|objc_" \
                || true

              echo
              echo "===== CLASSES ====="

              nm -arch arm64 "$FILE" 2>/dev/null \
                | grep -E \
                "_OBJC_CLASS_|_OBJC_METACLASS_" \
                || true

              echo
              echo "===== METHODS ====="

              nm -arch arm64 "$FILE" 2>/dev/null \
                | grep -E \
                "\-\[|\+\[" \
                || true

              echo
              echo "===== IVARS ====="

              nm -arch arm64 "$FILE" 2>/dev/null \
                | grep -E \
                "_OBJC_IVAR_" \
                || true

              echo
              echo "===== OBJC SECTIONS ====="

              otool -l "$FILE" 2>/dev/null \
                | grep -A15 -E \
                "__objc_|__DATA_CONST|__objc_const|__objc_data" \
                || true

            } > "analysis/objc/${SAFE}_objc.txt"

          done < analysis/macho/macho_files.txt

      - name: Swift analysis
        shell: bash
        run: |
          set +e

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            BASE="$(basename "$FILE")"
            SAFE="$(echo "$BASE" | tr ' /:' '___' | tr -cd '[:alnum:]_.-')"

            {
              echo "===== SWIFT SYMBOLS ====="

              nm -arch arm64 "$FILE" 2>/dev/null \
                | grep -Ei \
                "swift|Swift" \
                || true

              echo
              echo "===== SWIFT STRINGS ====="

              strings -a "$FILE" 2>/dev/null \
                | grep -Ei \
                "Swift|swift" \
                || true

            } > "analysis/swift/${SAFE}_swift.txt"

          done < analysis/macho/macho_files.txt

      - name: Extract all strings
        shell: bash
        run: |
          set +e

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            BASE="$(basename "$FILE")"
            SAFE="$(echo "$BASE" | tr ' /:' '___' | tr -cd '[:alnum:]_.-')"

            strings -a "$FILE" \
              > "analysis/strings/${SAFE}_all.txt" \
              2>&1 || true

            strings -a -t x "$FILE" \
              > "analysis/strings/${SAFE}_offsets.txt" \
              2>&1 || true

          done < analysis/macho/macho_files.txt

      - name: Deep string categorization
        shell: bash
        run: |
          set +e

          for FILE in analysis/strings/*_all.txt; do
            [ -f "$FILE" ] || continue

            BASE="$(basename "$FILE" _all.txt)"

            grep -Ei \
              "inject|loader|load|dylib|framework|bundle|hook|patch|spawn|process|library" \
              "$FILE" \
              > "analysis/strings/${BASE}_loading.txt" \
              || true

            grep -Ei \
              "http://|https://|api|server|endpoint|socket|tcp|udp|network|request|json" \
              "$FILE" \
              > "analysis/strings/${BASE}_network.txt" \
              || true

            grep -Ei \
              "key|auth|token|license|subscription|premium|activate|verify|validation" \
              "$FILE" \
              > "analysis/strings/${BASE}_auth.txt" \
              || true

            grep -Ei \
              "player|character|weapon|camera|render|shader|material|mesh|esp|aim|recoil|spread" \
              "$FILE" \
              > "analysis/strings/${BASE}_game.txt" \
              || true

            grep -Ei \
              "debug|log|error|warning|assert|crash|exception" \
              "$FILE" \
              > "analysis/strings/${BASE}_debug.txt" \
              || true

            grep -E \
              "^[[:space:]]*(https?|ftp)://|^[[:space:]]*[A-Za-z0-9._-]+\.[A-Za-z]{2,}" \
              "$FILE" \
              > "analysis/strings/${BASE}_urls.txt" \
              || true

          done

      - name: Search dynamic loading references
        shell: bash
        run: |
          set +e

          : > analysis/search/dynamic_loading.txt

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            {
              echo "============================================================"
              echo "$FILE"
              echo "============================================================"

              echo
              echo "===== SYMBOL REFERENCES ====="

              nm -arch arm64 "$FILE" 2>/dev/null \
                | grep -Ei \
                "dlopen|dlsym|dlclose|NSBundle|NSClassFromString|objc_getClass|class_get|method_get|performSelector" \
                || true

              echo
              echo "===== STRING REFERENCES ====="

              strings -a "$FILE" 2>/dev/null \
                | grep -Ei \
                "dlopen|dlsym|dlclose|NSBundle|NSClassFromString|@rpath|@loader_path|@executable_path" \
                || true

              echo

            } >> analysis/search/dynamic_loading.txt

          done < analysis/macho/macho_files.txt

      - name: Search interesting APIs
        shell: bash
        run: |
          set +e

          : > analysis/search/interesting_apis.txt

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            {
              echo "============================================================"
              echo "$FILE"
              echo "============================================================"

              nm -arch arm64 "$FILE" 2>/dev/null \
                | grep -Ei \
                "malloc|free|memcpy|memmove|mprotect|vm_|mach_|pthread|dispatch_|objc_msgSend|method_|class_|CG|CA|UI|NS" \
                || true

            } >> analysis/search/interesting_apis.txt

          done < analysis/macho/macho_files.txt

      - name: ARM64 disassembly
        shell: bash
        run: |
          set +e

          OBJDUMP="$(xcrun --find llvm-objdump)"

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            BASE="$(basename "$FILE")"
            SAFE="$(echo "$BASE" | tr ' /:' '___' | tr -cd '[:alnum:]_.-')"

            "$OBJDUMP" \
              --macho \
              --arch=arm64 \
              --disassemble \
              "$FILE" \
              > "analysis/disasm/${SAFE}_full.asm" \
              2>&1 || true

            "$OBJDUMP" \
              --macho \
              --arch=arm64 \
              --section=__TEXT,__text \
              "$FILE" \
              > "analysis/disasm/${SAFE}_text.asm" \
              2>&1 || true

          done < analysis/macho/macho_files.txt

      - name: Extract Objective-C selectors
        shell: bash
        run: |
          set +e

          : > analysis/search/selectors.txt

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            {
              echo "============================================================"
              echo "$FILE"
              echo "============================================================"

              strings -a "$FILE" 2>/dev/null \
                | grep -E \
                "^[A-Za-z_][A-Za-z0-9_]*(:[A-Za-z0-9_]+)*:?$" \
                | sort -u \
                || true

            } >> analysis/search/selectors.txt

          done < analysis/macho/macho_files.txt

      - name: Extract entitlements and signing
        shell: bash
        run: |
          set +e

          APP="$(cat analysis/app/app_path.txt)"

          {
            echo "===== CODESIGN ====="
            codesign -d -vvv "$APP"

            echo
            echo "===== ENTITLEMENTS ====="
            codesign -d --entitlements :- "$APP"

            echo
            echo "===== REQUIREMENT ====="
            codesign -d -r- "$APP"

            echo
            echo "===== VERIFY ====="
            codesign --verify --deep --strict --verbose=4 "$APP"

          } > analysis/signing/codesign.txt 2>&1 || true

          codesign -d --entitlements :- "$APP" \
            > analysis/signing/entitlements.plist \
            2>&1 || true

          if [ -f "$APP/embedded.mobileprovision" ]; then
            security cms -D \
              -i "$APP/embedded.mobileprovision" \
              > analysis/signing/mobileprovision.plist \
              2>&1 || true
          fi

      - name: Resource inventory
        shell: bash
        run: |
          set -e

          APP="$(cat analysis/app/app_path.txt)"

          find "$APP" -type f \
            \( \
              -name "*.png" \
              -o -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.gif" \
              -o -name "*.webp" \
              -o -name "*.json" \
              -o -name "*.plist" \
              -o -name "*.strings" \
              -o -name "*.txt" \
              -o -name "*.xml" \
              -o -name "*.html" \
              -o -name "*.js" \
              -o -name "*.css" \
              -o -name "*.metal" \
              -o -name "*.shader" \
            \) \
            -print \
            | sort \
            > analysis/resources/resource_files.txt

          find "$APP" -type f \
            -name "*.lproj" \
            -print \
            > analysis/resources/localizations.txt \
            2>/dev/null || true

      - name: Extract readable source-like resources
        shell: bash
        run: |
          set +e

          APP="$(cat analysis/app/app_path.txt)"

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            REL="${FILE#$APP/}"
            SAFE="$(echo "$REL" | tr '/ ' '__' | tr -cd '[:alnum:]_.-')"

            case "$FILE" in
              *.json|*.txt|*.strings|*.xml|*.html|*.js|*.css|*.metal|*.shader)
                cp "$FILE" \
                  "analysis/resources/${SAFE}" \
                  2>/dev/null || true
                ;;
              *.plist)
                plutil -p "$FILE" \
                  > "analysis/resources/${SAFE}.readable.txt" \
                  2>&1 || true
                ;;
            esac

          done < analysis/resources/resource_files.txt

      - name: SHA256 inventory
        shell: bash
        run: |
          set -e

          find extracted \
            -type f \
            -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            > analysis/hashes/sha256.txt

          shasum -a 256 Droze.ipa \
            > analysis/hashes/Droze_ipa_sha256.txt

      - name: Build master report
        shell: bash
        run: |
          set +e

          {
            echo "============================================================"
            echo "DROZE IPA - DEEP STATIC ANALYSIS"
            echo "============================================================"
            echo
            echo "Generated: $(date -u)"
            echo
            echo "===== APP ====="
            cat analysis/app/app_path.txt
            echo
            echo "===== MACH-O FILES ====="
            cat analysis/macho/macho_files.txt
            echo
            echo "===== DYLIBS ====="
            cat analysis/macho/dylibs.txt
            echo
            echo "===== FRAMEWORKS ====="
            cat analysis/macho/frameworks.txt
            echo
            echo "===== BUNDLES ====="
            cat analysis/macho/bundles.txt
            echo
            echo "===== DYNAMIC LOADING ====="
            cat analysis/search/dynamic_loading.txt
            echo
            echo "===== DEPENDENCIES ====="
            cat analysis/search/dependencies.txt
            echo
            echo "===== INTERESTING APIs ====="
            cat analysis/search/interesting_apis.txt
            echo
            echo "===== SELECTORS ====="
            cat analysis/search/selectors.txt

          } > analysis/report/MASTER_REPORT.txt

      - name: Generate focused findings
        shell: bash
        run: |
          set +e

          {
            echo "DROZE - IMPORTANT FINDINGS"
            echo "Generated: $(date -u)"
            echo

            echo "===== INJECTION / LOADING ====="
            grep -R -Ei \
              "inject|injection|loader|loading|dlopen|dlsym|dylib|NSBundle|@rpath|@loader_path|@executable_path" \
              analysis \
              2>/dev/null \
              | head -30000 \
              || true

            echo
            echo "===== OBJECTIVE-C ====="
            grep -R -Ei \
              "OBJC_CLASS|OBJC_METACLASS|OBJC_IVAR|-\[|\+\[" \
              analysis/objc analysis/symbols \
              2>/dev/null \
              | head -30000 \
              || true

            echo
            echo "===== NETWORK ====="
            grep -R -Ei \
              "https?://|api|endpoint|socket|tcp|udp|request|json" \
              analysis/strings \
              2>/dev/null \
              | head -30000 \
              || true

            echo
            echo "===== AUTH / LICENSE ====="
            grep -R -Ei \
              "key|auth|token|license|subscription|premium|activate|verify|validation" \
              analysis/strings \
              2>/dev/null \
              | head -30000 \
              || true

            echo
            echo "===== GAME / RUNTIME ====="
            grep -R -Ei \
              "player|character|weapon|camera|render|shader|material|mesh|esp|aim|recoil|spread" \
              analysis/strings analysis/symbols \
              2>/dev/null \
              | head -30000 \
              || true

          } > analysis/report/IMPORTANT_FINDINGS.txt

      - name: Package complete analysis
        shell: bash
        run: |
          set -e

          zip -qr \
            Droze-analysis.zip \
            analysis

          echo "======================================"
          echo "Analysis complete"
          echo "======================================"
          du -sh analysis
          ls -lh Droze-analysis.zip

      - name: Upload complete analysis
        uses: actions/upload-artifact@v4
        with:
          name: Droze-analysis
          path: Droze-analysis.zip
          retention-days: 14
          if-no-files-found: error