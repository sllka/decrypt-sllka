name: Inject Dylib into Droze IPA (Rust)

on:
  workflow_dispatch:
    inputs:
      dylib_name:
        description: 'Имя твоего .dylib файла (например, cheat.dylib)'
        required: true
        default: 'cheat.dylib'

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust insert-dylib tool
        run: |
          cargo install insert-dylib

      - name: Unpack Droze.ipa
        run: |
          if [ ! -f "Droze.ipa" ]; then
            echo "Ошибка: файл Droze.ipa не найден в корне репозитория!"
            exit 1
          fi
          mkdir -p extracted
          unzip -q Droze.ipa -d extracted/

      - name: Inject Dylib via Rust insert-dylib
        run: |
          APP_PATH=$(find extracted/Payload -name "*.app" | head -n 1)
          APP_NAME=$(basename "$APP_PATH" .app)
          BINARY="$APP_PATH/$APP_NAME"
          DYLIB="${{ github.event.inputs.dylib_name }}"
          
          if [ ! -f "$DYLIB" ]; then
            echo "Ошибка: файл ддилибки '$DYLIB' не найден в корне репозитория!"
            exit 1
          fi

          echo "Копируем $DYLIB внутрь бандла приложения..."
          cp "$DYLIB" "$APP_PATH/"

          echo "Выполняем инъекцию через Rust insert-dylib..."
          # Флаг --inplace патчит файл на месте, --weak добавляет слабую зависимость, --all-yes автоподтверждает запросы
          insert-dylib --inplace --weak --all-yes "@executable_path/$DYLIB" "$BINARY"
          
          echo "Инъекция успешно завершена!"

      - name: Repackage IPA
        run: |
          cd extracted
          zip -qr ../Droze_Injected.ipa *
          cd ..
          rm -rf extracted

      - name: Upload Injected IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droze-Injected-IPA
          path: Droze_Injected.ipa
